[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "context-loom"
version = "0.1.0"
description = "A reusable AI workflow framework for shared-context reasoning, complexity-aware forking, focused execution, and traceable aggregation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhang Yudi" }]
keywords = ["ai", "agents", "workflow", "context", "fork", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
context-loom = "context_loom.cli:main"

[project.urls]
Homepage = "https://github.com/zhangyudi-01/context-loom"
Repository = "https://github.com/zhangyudi-01/context-loom.git"

[tool.setuptools.packages.find]
where = ["src"]

