<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Context Loom — Skills for Focused, High-Quality AI Work</title>
  <desc id="desc">An original Context Loom mark sits beside the title. Four colored woven bands below illustrate understand, fork, focus, and verify.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F5FE"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="440" x2="500" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#9879F7"/><stop offset="1" stop-color="#5F4ED9"/></linearGradient>
    <linearGradient id="blue" x1="320" y1="440" x2="900" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#55B2FF"/><stop offset="1" stop-color="#2855DB"/></linearGradient>
    <linearGradient id="teal" x1="770" y1="440" x2="1320" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#58D8C6"/><stop offset="1" stop-color="#138D9A"/></linearGradient>
    <linearGradient id="gold" x1="1170" y1="440" x2="1600" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD576"/><stop offset="1" stop-color="#F38B55"/></linearGradient>
    <clipPath id="card"><rect width="1600" height="800" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1600" height="800" fill="url(#paper)"/>
    <path d="M0 440H1600V800H0Z" fill="#142747"/>
    <path d="M0 440H390L590 800H0Z" fill="url(#purple)"/>
    <path d="M332 440H785L985 800H570Z" fill="url(#blue)"/>
    <path d="M738 440H1220L1420 800H958Z" fill="url(#teal)"/>
    <path d="M1172 440H1600V800H1395Z" fill="url(#gold)"/>
    <path d="M52 440L248 800M469 440L669 800M883 440L1080 800M1293 440L1490 800" fill="none" stroke="#F9FBFF" stroke-width="5" opacity=".48"/>
    <g transform="translate(82 97) scale(.84)">
      <rect x="8" y="8" width="240" height="240" rx="58" fill="#172B4D"/>
      <path d="M70 74C91 53 113 62 128 82C144 104 157 113 183 91C201 76 209 52 198 44" fill="none" stroke="#68BEFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M58 44C47 53 55 77 73 92C99 113 112 104 128 82C143 62 165 53 186 74" fill="none" stroke="#A98BFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M70 182C91 203 113 194 128 174C144 152 157 143 183 165C201 180 209 204 198 212" fill="none" stroke="#A98BFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M58 212C47 203 55 179 73 164C99 143 112 152 128 174C143 194 165 203 186 182" fill="none" stroke="#68BEFF" stroke-width="18" stroke-linecap="round"/>
      <circle cx="128" cy="128" r="23" fill="#F8FBFF"/><circle cx="128" cy="128" r="9" fill="#172B4D"/>
    </g>
    <g font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">
      <text x="317" y="170" fill="#13294B" font-size="80" font-weight="800" letter-spacing="-2">Context Loom</text>
      <text x="322" y="235" fill="#3C5070" font-size="39" font-weight="500">Skills for Focused, High-Quality AI Work</text>
      <text x="330" y="302" fill="#61728E" font-size="29">聚焦当前任务，让 AI 持续产出高质量成果。</text>
      <rect x="322" y="338" width="1110" height="52" rx="26" fill="#E4EBF7"/>
      <text x="354" y="373" fill="#345077" font-size="24" font-weight="600">Understand once.  Fork with memory.  Focus on one task.  Verify and merge.</text>
      <g fill="#FFFFFF">
        <text x="80" y="601" font-size="30" font-weight="700">01  UNDERSTAND</text>
        <text x="481" y="601" font-size="30" font-weight="700">02  FORK</text>
        <text x="880" y="601" font-size="30" font-weight="700">03  FOCUS</text>
        <text x="1270" y="601" font-size="30" font-weight="700">04  VERIFY</text>
      </g>
      <g fill="#F0F5FF" font-size="21">
        <text x="80" y="644">Shared baseline</text>
        <text x="481" y="644">Complexity-aware plan</text>
        <text x="880" y="644">One bounded task</text>
        <text x="1270" y="644">Traceable merge</text>
      </g>
      <text x="80" y="752" fill="#FFFFFF" font-size="19" font-weight="600" opacity=".92">A reusable AI workflow framework</text>
    </g>
  </g>
</svg>
