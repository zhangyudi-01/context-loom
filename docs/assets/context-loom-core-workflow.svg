<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Context Loom core workflow</title>
  <desc id="desc">Shared sources are compiled into a baseline, tasks are routed by complexity, focused workers produce validated results, and the results are assembled deterministically.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#14233D"/><stop offset=".52" stop-color="#1D3154"/><stop offset="1" stop-color="#392C66"/></linearGradient>
    <linearGradient id="baseline" x1="470" y1="170" x2="980" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#254F78"/><stop offset="1" stop-color="#26365F"/></linearGradient>
    <linearGradient id="simple" x1="160" y1="525" x2="720" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#163F6D"/><stop offset="1" stop-color="#1D3159"/></linearGradient>
    <linearGradient id="complex" x1="870" y1="525" x2="1430" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#403272"/><stop offset="1" stop-color="#292B59"/></linearGradient>
    <linearGradient id="accent" x1="230" y1="790" x2="1370" y2="790" gradientUnits="userSpaceOnUse"><stop stop-color="#155C50"/><stop offset="1" stop-color="#23734E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071225" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#9CB2D3"/></marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="84" y="88" fill="#F7F9FF" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">Context Loom core workflow</text>
  <text x="86" y="130" fill="#B8C5DC" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="22">Understand once. Fork with memory. Focus on one task. Verify and merge.</text>
  <g filter="url(#shadow)">
    <rect x="80" y="222" width="310" height="188" rx="30" fill="#162740" stroke="#2C476A" stroke-width="2"/>
    <rect x="470" y="170" width="520" height="280" rx="36" fill="url(#baseline)" stroke="#A7C6ED" stroke-width="2"/>
    <rect x="1080" y="222" width="440" height="188" rx="30" fill="#162740" stroke="#2C476A" stroke-width="2"/>
    <rect x="160" y="525" width="590" height="212" rx="32" fill="url(#simple)" stroke="#78A6DF" stroke-width="2"/>
    <rect x="850" y="525" width="590" height="212" rx="32" fill="url(#complex)" stroke="#8C69DE" stroke-width="2"/>
    <rect x="230" y="782" width="1140" height="64" rx="32" fill="url(#accent)" stroke="#2E8C6A" stroke-width="2"/>
  </g>
  <g font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="112" y="246" width="138" height="38" rx="19" fill="#412F69"/><text x="181" y="272" fill="#CBB8FF" font-size="17" font-weight="700" text-anchor="middle">SHARED SOURCES</text>
    <text x="235" y="325" fill="#F4F7FF" font-size="30" font-weight="700" text-anchor="middle">公共输入</text><text x="235" y="361" fill="#C5D1E3" font-size="20" text-anchor="middle">项目上下文 / 共同规则</text><text x="235" y="390" fill="#C5D1E3" font-size="20" text-anchor="middle">需求与约束</text>
    <rect x="508" y="204" width="246" height="40" rx="20" fill="#294463"/><text x="631" y="231" fill="#65B4FF" font-size="18" font-weight="700" text-anchor="middle">SHARED BASELINE</text>
    <text x="730" y="310" fill="#F5F8FF" font-size="38" font-weight="700" text-anchor="middle">统一建立共享上下文</text><text x="730" y="354" fill="#C5D5EA" font-size="22" text-anchor="middle">明确项目目标、来源、约束与交付物</text><text x="730" y="397" fill="#94B9E1" font-size="19" text-anchor="middle">编译一次 · 指纹固定 · 后续任务复用</text>
    <rect x="1120" y="246" width="128" height="38" rx="19" fill="#15554C"/><text x="1184" y="272" fill="#72E2B9" font-size="17" font-weight="700" text-anchor="middle">ROUTING</text>
    <text x="1300" y="325" fill="#F4F7FF" font-size="30" font-weight="700" text-anchor="middle">任务路由</text><text x="1300" y="362" fill="#C5D1E3" font-size="20" text-anchor="middle">按复杂度和上下文范围</text><text x="1300" y="391" fill="#C5D1E3" font-size="20" text-anchor="middle">规划简单批次或独立 Fork</text>
    <rect x="194" y="553" width="146" height="38" rx="19" fill="#16558A"/><text x="267" y="579" fill="#77C2FF" font-size="17" font-weight="700" text-anchor="middle">SIMPLE TASKS</text>
    <text x="455" y="635" fill="#F4F7FF" font-size="31" font-weight="700" text-anchor="middle">简单任务批次计划</text><circle cx="224" cy="680" r="7" fill="#4E9CFF"/><text x="248" y="687" fill="#D8E4F2" font-size="20">相近任务组成受控批次</text><circle cx="224" cy="714" r="7" fill="#4E9CFF"/><text x="248" y="721" fill="#D8E4F2" font-size="20">准备边界清晰的输入包</text>
    <rect x="884" y="553" width="168" height="38" rx="19" fill="#4C3478"/><text x="968" y="579" fill="#C5A8FF" font-size="17" font-weight="700" text-anchor="middle">COMPLEX TASKS</text>
    <text x="1145" y="635" fill="#F4F7FF" font-size="31" font-weight="700" text-anchor="middle">复杂任务独立 Fork 计划</text><circle cx="914" cy="680" r="7" fill="#A07CFF"/><text x="938" y="687" fill="#E0D9F3" font-size="20">复用 baseline 的共同理解</text><circle cx="914" cy="714" r="7" fill="#A07CFF"/><text x="938" y="721" fill="#E0D9F3" font-size="20">聚焦当前任务的局部上下文</text>
    <text x="800" y="823" fill="#EFFAF4" font-size="25" font-weight="700" text-anchor="middle">验证结果 · 保留追溯 · 按声明顺序确定性合并</text>
  </g>
  <g fill="none" stroke="#9CB2D3" stroke-width="4" marker-end="url(#arrow)"><path d="M390 316H458"/><path d="M1000 316H1068"/><path d="M1300 410V470H455V515"/><path d="M1300 470H1145V515"/><path d="M455 737V765"/><path d="M1145 737V765"/></g>
  <text x="800" y="875" fill="#8295B4" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Not one giant prompt · not contextless parallelism · a bounded workflow for high-quality AI work</text>
</svg>
